name: Build & Release

# Every push to any branch -> test release (pre-release, tag test-<run-number>).
# Push of a tag vX.Y.Z      -> normal release (tag vX.Y.Z, not a pre-release),
#                              this is what F-Droid's UpdateCheckMode follows.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode signing keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fosspdf-release.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/fosspdf-release.p12" >> "$GITHUB_ENV"
          fi

      - name: Test & build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:testDebugUnitTest
          if [ -n "$KEYSTORE_PATH" ]; then
            ./gradlew :app:assembleRelease
            echo "APK_PATH=app/build/outputs/apk/release/Foss-PDF.apk" >> "$GITHUB_ENV"
          else
            ./gradlew :app:assembleDebug
            echo "APK_PATH=app/build/outputs/apk/debug/Foss-PDF.apk" >> "$GITHUB_ENV"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('test-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Test-Release {0} ({1}, {2})', github.run_number, github.ref_name, github.sha) }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          files: ${{ env.APK_PATH }}
